# Application Configuration
settings:
  provider: "ollama"
  model: "gemma4:31b-cloud"
  api_key: ""
  base_url: "http://localhost:11434/v1"
  max_context_tokens: 200000  # auto-trim history when exceeded
  enable_verification: false    # critique-pass answer verification (opt-in)
  verifier_model: ""            # empty = use the main model for verification
  enable_moderation: false      # input/output moderation filter (opt-in)
  moderation_deny_list: []      # extra terms the moderation filter should block
  vector_backend: "sqlite"      # vector store backend: "sqlite" or "faiss" (faiss requires the optional package)

# Approved root directories for MCP filesystem access.
roots:
  - "."          # project root (default)

# Default MCP Servers to load
servers:
  - id: "doc_server"
    script: "veda_engine"
    args: []
    env: {}

  - id: "filesystem"
    script: "@modelcontextprotocol/server-filesystem"
    args: ["."]
    env: {}

  - id: "memory"
    script: "@modelcontextprotocol/server-memory"
    args: []
    env: {}

  - id: "everything"
    script: "@modelcontextprotocol/server-everything"
    args: []
    env: {}

  - id: "mock_mail"
    script: "setu_bridge.mock_mail"
    args: []
    env: {}

  - id: "refiner"
    script: "vajra_gate.tools.refiner"
    args: []
    env: {}

  # Web UI authentication: set HIIL_WEBUI_USERNAME and HIIL_WEBUI_PASSWORD env vars
  # API keys: use `hiil key set <provider> <key>` or MODEL_API_KEY env var instead of plaintext below
  # pdf-server uses HTTP/SSE transport (not stdio) — skipped for now
  # - id: "pdf"
  #   script: "@modelcontextprotocol/server-pdf"
  #   args: []
  #   env: {}
