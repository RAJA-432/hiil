[project]
name = "hiil"
version = "0.2.0"
description = "CLI + Web chat backed by MCP tool servers"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.8.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "cryptography>=42.0",

    "fastapi",
    "uvicorn[standard]",
    "websockets>=14,<16",
    "aiofiles>=23.0",
    "tiktoken>=0.7.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-setuptools>=70.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "mcp_cli", "mcp_cli.ui", "mcp_cli.commands", "mcp_cli.services",
    "setu_bridge",
    "vajra_gate", "vajra_gate.middleware", "vajra_gate.routers", "vajra_gate.schemas",
    "vajra_gate.services", "vajra_gate.tools",
    "veda_engine", "veda_engine.storage", "veda_engine.tools", "veda_engine.resources",

]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["asyncio: async test"]
filterwarnings = [
    "ignore:::fastapi.testclient:",
]
addopts = "--cov=mcp_cli --cov=vajra_gate --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["mcp_cli", "vajra_gate"]
omit = ["*/tests/*", "*.venv/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S"]
ignore = ["S101", "S311", "E402", "E501", "E701", "E741", "S110", "N802", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "W291", "N802", "N803", "N806", "F841"]
"mcp_cli/locales/*" = ["N999"]
"veda_engine/*" = ["N999"]
"vajra_gate/models.py" = ["N815"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "^numpy",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
