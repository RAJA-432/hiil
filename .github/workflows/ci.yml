name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv and project
        run: |
          pip install uv
          uv pip install -e ".[dev]" --system

      - name: lint
        run: ruff check mcp_cli setu_bridge veda_engine vajra_gate tests/

      - name: typecheck
        run: mypy mcp_cli setu_bridge veda_engine vajra_gate --ignore-missing-imports

      - name: test
        run: pytest tests/ -q

      - name: eval golden smoke
        run: python -m eval.runner --smoke
