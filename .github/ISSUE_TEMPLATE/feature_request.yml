name: ✨ Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe it clearly below.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this feature solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the feature work? Include behavior, API shape, or UI sketch if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Where does this feature live?
      options:
        - Backend (vajra_gate / mcp_cli)
        - Frontend (canvas_app)
        - MCP tools (veda_engine / setu_bridge)
        - CLI
        - Docker / deployment
        - Other
