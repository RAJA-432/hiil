<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H.I.I.L. — Hyper-Integrated Inference Engine</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>△</text></svg>" />
    <link rel="manifest" href="/canvas/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="H.I.I.L. — Hyper-Integrated Inference Engine. Private AI assistant running local LLMs on your desktop." />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="H.I.I.L. — Hyper-Integrated Inference Engine" />
    <meta property="og:description" content="Private AI assistant. Local LLMs. Your data stays on your machine." />
    <meta property="og:type" content="website" />
    <script src="/canvas/error-fallback.js"></script>
    <script src="/canvas/theme-init.js"></script>
    <script type="application/webmcp+json">
      {
        "version": "1.0",
        "forms": [
          {
            "name": "message-composer",
            "description": "Compose and send messages to the AI assistant",
            "fields": [
              { "name": "message-input", "label": "Message", "type": "text", "required": true },
              { "name": "send-button", "label": "Send message", "type": "button" }
            ]
          }
        ]
      }
    </script>
    <link rel="preload" href="/src/styles/index.css" as="style" />
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;padding:20px;text-align:center">
          <p>H.I.I.L. requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
        </div>
      </noscript>
      <div id="splash" style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg,#0d0d0d);color:var(--text,#e0e0e0);font-family:system-ui,sans-serif;flex-direction:column;gap:16px">
        <div class="splash-spinner" style="width:32px;height:32px;border:3px solid var(--border,#222);border-top-color:var(--primary,#4a9eff);border-radius:50%;animation:spin .8s linear infinite"></div>
        <span style="font-size:14px;color:var(--text-muted,#666)">Loading H.I.I.L.…</span>
      </div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
