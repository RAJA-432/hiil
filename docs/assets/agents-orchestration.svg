<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <radialGradient id="dispGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12233f"/>
      <stop offset="100%" stop-color="#224a85"/>
    </linearGradient>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a9eff"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="900" height="560" rx="24" fill="#0f1626"/>

  <text x="450" y="48" text-anchor="middle" fill="#e8eef7" font-size="20" font-weight="700" letter-spacing="2">MULTI-AGENT ORCHESTRATION</text>
  <text x="450" y="70" text-anchor="middle" fill="#8fa3bf" font-size="12">Agent Runtime · route · run · resume · stop</text>

  <!-- main query input -->
  <rect x="330" y="96" width="240" height="40" rx="20" fill="url(#qTop)" stroke="#4a9eff" stroke-width="2"/>
  <text x="450" y="121" text-anchor="middle" fill="#e8eef7" font-size="14" font-weight="600">Main Query</text>
  <line x1="450" y1="136" x2="450" y2="168" stroke="#4a9eff" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <!-- dispatcher / agent registry -->
  <g transform="translate(450,225)">
    <circle r="78" fill="url(#dispGlow)"/>
    <rect x="-92" y="-34" width="184" height="68" rx="16" fill="#1c3a6b" stroke="#4a9eff" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" fill="#e8eef7" font-size="15" font-weight="700">Agent Registry</text>
    <text x="0" y="14" text-anchor="middle" fill="#8fa3bf" font-size="11">dispatcher · router</text>
    <circle cx="-86" cy="0" r="6" fill="#34d399"/>
    <circle cx="86" cy="0" r="6" fill="#34d399"/>
  </g>
  <line x1="450" y1="168" x2="450" y2="190" stroke="#4a9eff" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <!-- routing lines to agents -->
  <path d="M450,260 Q370,300 285,330" fill="none" stroke="#4a9eff" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <path d="M450,260 Q450,300 450,330" fill="none" stroke="#4a9eff" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <path d="M450,260 Q530,300 615,330" fill="none" stroke="#4a9eff" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <!-- ===== agent cards ===== -->
  <!-- Task Agent -->
  <g>
    <rect x="195" y="336" width="180" height="120" rx="14" fill="#0f1a33" stroke="#34d399" stroke-width="2"/>
    <text x="285" y="366" text-anchor="middle" fill="#34d399" font-size="14" font-weight="600">Task Agent</text>
    <g transform="translate(285,410)">
      <rect x="-12" y="-12" width="24" height="24" rx="5" fill="#12301f" stroke="#34d399" stroke-width="1.5"/>
      <path d="M-6,0 L-2,4 L6,-5" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="285" y="445" text-anchor="middle" fill="#8fa3bf" font-size="10">checklists · actions</text>
  </g>

  <!-- Search Agent -->
  <g>
    <rect x="360" y="336" width="180" height="120" rx="14" fill="#0f1a33" stroke="#4a9eff" stroke-width="2"/>
    <text x="450" y="366" text-anchor="middle" fill="#4a9eff" font-size="14" font-weight="600">Search Agent</text>
    <g transform="translate(450,410)">
      <circle r="11" fill="none" stroke="#4a9eff" stroke-width="2.5"/>
      <circle r="5" fill="#4a9eff" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="11" ry="4.5" fill="none" stroke="#4a9eff" stroke-width="1" stroke-dasharray="2 2" transform="rotate(-20)"/>
      <line x1="8" y1="8" x2="15" y2="15" stroke="#4a9eff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="450" y="445" text-anchor="middle" fill="#8fa3bf" font-size="10">web · workspace search</text>
  </g>

  <!-- Analyst Agent -->
  <g>
    <rect x="525" y="336" width="180" height="120" rx="14" fill="#0f1a33" stroke="#f5c542" stroke-width="2"/>
    <text x="615" y="366" text-anchor="middle" fill="#f5c542" font-size="14" font-weight="600">Analyst Agent</text>
    <g transform="translate(615,410)">
      <rect x="-14" y="-6" width="28" height="20" rx="3" fill="#2a1a0a" stroke="#f5c542" stroke-width="1.5"/>
      <rect x="-10" y="2" width="5" height="8" fill="#f5c542"/>
      <rect x="-3" y="-2" width="5" height="12" fill="#f5c542" opacity="0.75"/>
      <rect x="4" y="-4" width="5" height="14" fill="#f5c542" opacity="0.5"/>
    </g>
    <text x="615" y="445" text-anchor="middle" fill="#8fa3bf" font-size="10">metrics · insights</text>
  </g>

  <!-- thread / session loop -->
  <g>
    <rect x="180" y="488" width="540" height="40" rx="20" fill="#101c36" stroke="#2a3c5f" stroke-width="2"/>
    <text x="450" y="513" text-anchor="middle" fill="#8fa3bf" font-size="13" font-family="monospace">thread_id · session_id</text>

    <!-- loop arrows: agents back to thread bar -->
    <path d="M285,456 Q285,480 300,488" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrGreen)"/>
    <path d="M450,456 Q450,480 450,488" fill="none" stroke="#4a9eff" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrGreen)"/>
    <path d="M615,456 Q615,480 600,488" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrGreen)"/>
  </g>

  <!-- combined answer out -->
  <line x1="720" y1="508" x2="770" y2="508" stroke="#34d399" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="772" y="486" width="108" height="44" rx="12" fill="#12301f" stroke="#34d399" stroke-width="2"/>
  <text x="826" y="512" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">Combined</text>
  <text x="826" y="525" text-anchor="middle" fill="#8fa3bf" font-size="10">Answer</text>
</svg>
