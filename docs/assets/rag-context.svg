<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="qLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12233f"/>
      <stop offset="100%" stop-color="#1c3a6b"/>
    </linearGradient>
    <linearGradient id="qRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c3a6b"/>
      <stop offset="100%" stop-color="#12233f"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c542" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a9eff"/>
    </marker>
    <marker id="arrGold" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#f5c542"/>
    </marker>
  </defs>

  <rect width="900" height="560" rx="24" fill="#0f1626"/>

  <!-- panel headers -->
  <rect x="30" y="24" width="415" height="40" rx="10" fill="url(#qLeft)"/>
  <text x="238" y="50" text-anchor="middle" fill="#e8eef7" font-size="15" font-weight="700">LOCAL SYSTEM</text>

  <rect x="455" y="24" width="415" height="40" rx="10" fill="url(#qRight)"/>
  <text x="663" y="50" text-anchor="middle" fill="#e8eef7" font-size="15" font-weight="700">LLM QUERY</text>

  <line x1="450" y1="70" x2="450" y2="520" stroke="#2a3c5f" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- ===== left: source docs falling into vector store ===== -->
  <g>
    <!-- PDF -->
    <g transform="translate(150,120)">
      <rect x="-18" y="-24" width="36" height="48" rx="4" fill="#f87171"/>
      <text x="-6" y="2" fill="#fff" font-size="13" font-weight="700" font-family="Arial, sans-serif">PDF</text>
      <path d="M-18,-12 h36" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
    <line x1="150" y1="170" x2="150" y2="270" stroke="#f5c542" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrGold)"/>

    <!-- DOCX -->
    <g transform="translate(300,140)">
      <rect x="-18" y="-24" width="36" height="48" rx="4" fill="#4a9eff"/>
      <text x="-11" y="3" fill="#fff" font-size="14" font-weight="700" font-family="Arial, sans-serif">W</text>
      <rect x="-14" y="16" width="28" height="3" rx="1.5" fill="#fff" opacity="0.5"/>
    </g>
    <line x1="300" y1="190" x2="300" y2="270" stroke="#f5c542" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrGold)"/>

    <!-- TEXT block -->
    <g transform="translate(210,180)">
      <rect x="-18" y="-16" width="36" height="32" rx="4" fill="#34d399"/>
      <rect x="-12" y="-8" width="24" height="3" rx="1.5" fill="#0f1626" opacity="0.8"/>
      <rect x="-12" y="-2" width="24" height="3" rx="1.5" fill="#0f1626" opacity="0.55"/>
      <rect x="-12" y="4" width="16" height="3" rx="1.5" fill="#0f1626" opacity="0.3"/>
    </g>
    <line x1="210" y1="205" x2="210" y2="270" stroke="#f5c542" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrGold)"/>

    <!-- Vector Store (SQLite cylinder) -->
    <g transform="translate(225,380)">
      <ellipse cx="0" cy="52" rx="75" ry="16" fill="#0d1b33"/>
      <path d="M-75,0 L-75,52 A75,16 0 0,0 75,52 L75,0 Z" fill="#1c3a6b" stroke="#4a9eff" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="75" ry="16" fill="#224a85" stroke="#4a9eff" stroke-width="2.5"/>
      <rect x="-58" y="6" width="116" height="14" rx="7" fill="#12233f"/>
      <text x="-42" y="17" fill="#8fa3bf" font-size="10" font-family="monospace">chunks[]</text>
      <circle cx="0" cy="52" r="50" fill="url(#glowGreen)"/>
    </g>
    <text x="225" y="470" text-anchor="middle" fill="#34d399" font-size="14" font-weight="600">Vector Store</text>
    <text x="225" y="487" text-anchor="middle" fill="#8fa3bf" font-size="11">SQLite · embeddings</text>
  </g>

  <!-- retrieved context chunks flying right -->
  <g>
    <rect x="300" y="330" width="120" height="34" rx="8" fill="#12301f" stroke="#34d399" stroke-width="1.5"/>
    <text x="360" y="351" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace">ctx[0]</text>
    <rect x="340" y="270" width="120" height="34" rx="8" fill="#12301f" stroke="#34d399" stroke-width="1.5"/>
    <text x="400" y="291" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace">ctx[1]</text>
    <rect x="380" y="220" width="120" height="34" rx="8" fill="#12301f" stroke="#34d399" stroke-width="1.5"/>
    <text x="440" y="241" text-anchor="middle" fill="#34d399" font-size="11" font-family="monospace">ctx[2]</text>

    <path d="M300,347 Q470,340 520,300" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrBlue)"/>
    <path d="M460,287 Q520,285 540,280" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrBlue)"/>
    <path d="M500,237 Q530,250 545,270" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrBlue)"/>
  </g>

  <!-- ===== right: query bubble + merge into final prompt → brain ===== -->
  <g>
    <circle cx="740" cy="170" r="60" fill="url(#glowGold)"/>
    <g transform="translate(740,150)">
      <rect x="-52" y="-26" width="104" height="52" rx="26" fill="#12233f" stroke="#f5c542" stroke-width="2.5"/>
      <text x="0" y="1" text-anchor="middle" fill="#e8eef7" font-size="15">Question?</text>
      <path d="M-18,26 L-30,52 L-2,30" fill="#12233f" stroke="#f5c542" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <text x="740" y="260" text-anchor="middle" fill="#f5c542" font-size="13" font-weight="600">Query</text>
  </g>

  <!-- merge into final prompt -->
  <rect x="585" y="330" width="230" height="40" rx="10" fill="#2a1a0a" stroke="#f5c542" stroke-width="2"/>
  <text x="700" y="355" text-anchor="middle" fill="#f5c542" font-size="13" font-weight="600">Final Prompt</text>

  <path d="M545,280 Q545,320 585,340" fill="none" stroke="#f5c542" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrGold)"/>
  <path d="M740,280 Q740,320 720,340" fill="none" stroke="#f5c542" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrGold)"/>

  <!-- brain / LLM -->
  <g transform="translate(700,455)">
    <circle cx="0" cy="0" r="46" fill="#12233f" stroke="#4a9eff" stroke-width="2.5"/>
    <path d="M-24,-18 C-36,-8 -36,14 -22,26 C-14,33 -2,32 0,26 C2,32 14,33 22,26 C36,14 36,-8 24,-18 C12,-26 12,-6 0,-6 C-12,-6 -12,-26 -24,-18 Z"
          fill="none" stroke="#4a9eff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0,-26 L0,-6 M-12,-18 L-7,-8 M12,-18 L7,-8 M-22,-4 L-9,2 M22,-4 L9,2 M-18,20 L-6,12 M18,20 L6,12"
          stroke="#4a9eff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <circle cx="0" cy="0" r="4" fill="#4a9eff"/>
    <circle cx="0" cy="0" r="60" fill="url(#glowGold)" opacity="0.5"/>
  </g>
  <path d="M700,380 L700,408" stroke="#f5c542" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrGold)"/>
  <text x="700" y="525" text-anchor="middle" fill="#4a9eff" font-size="14" font-weight="600">LLM</text>
  <text x="700" y="542" text-anchor="middle" fill="#8fa3bf" font-size="11">Ollama / OpenAI-compatible</text>

  <!-- caption -->
  <text x="238" y="525" text-anchor="middle" fill="#5c6e8c" font-size="11">chunk · embed · store</text>
  <text x="450" y="100" text-anchor="middle" fill="#5c6e8c" font-size="11" letter-spacing="1">retrieved context chunks merge with the query</text>
</svg>
